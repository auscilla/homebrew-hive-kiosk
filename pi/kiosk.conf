# Homebrew Hive kiosk settings. Sourced by the Pi scripts. No secrets in this file.
# Installed to /etc/hive-kiosk/kiosk.conf

# Live kiosk (GitHub Pages, "Homebrew Hive Kiosk", same build as working-kiosk).
KIOSK_URL="https://auscilla.github.io/homebrew-hive-kiosk/"

HOSTNAME="kiosk"
WIFI_COUNTRY="US"

# Software gain on top of a 100% hardware mixer. 200% is about +6 dB.
VOLUME_BOOST="200%"

# Top-level sites Chromium must not open. YouTube watch pages are listed here.
# Embeds stay allowed in pi/chromium-policy.json (do not add youtube-nocookie.com).
# shellcheck disable=SC2034
BLOCKED_HOSTS="youtube.com www.youtube.com m.youtube.com youtu.be music.youtube.com facebook.com www.facebook.com m.facebook.com instagram.com www.instagram.com tiktok.com www.tiktok.com twitter.com x.com www.x.com reddit.com www.reddit.com"
